name: Lint content

# Checks the folder/file naming conventions. Separate from the deploy workflow on purpose:
# a misplaced file is reported here but never blocks the website from updating.
on:
  pull_request:
    paths: ["content/**", "site/**"]
  push:
    branches: [main]
    paths: ["content/**", "site/scripts/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            content
            site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/lint-content.mjs
        working-directory: site
